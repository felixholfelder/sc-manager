name: Build and Deploy SC-Manager app to Firebase Hosting

on:
  push:
    branches:
      - "**"
  pull_request_target:
    branches:
      - "**"

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # nötig für Google-Auth via Workload Identity (optional, siehe unten)
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore

      - name: Setze Variablen in sc-manager app
        uses: microsoft/variable-substitution@v1
        with:
          files: 'sc-manager/wwwroot/appsettings.Production.json'
        env:
          Firebase.ApiKey: ${{ secrets.FIREBASE_API_KEY }}
          Firebase.AuthDomain: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          Firebase.ProjectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          Firebase.StorageBucket: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          Firebase.MessagingSenderId: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          Firebase.AppId: ${{ secrets.FIREBASE_APP_ID }}
          ApiBaseUrl: "/"

      - name: Setze Variablen in api app
        uses: microsoft/variable-substitution@v1
        with:
          files: 'Api/appsettings.Production.json'
        env:
          Firebase.ProjectId: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Blazor App veröffentlichen (Release-Build)
        run: dotnet publish ./sc-manager/sc-manager.csproj -c Release -o release

      - name: Firebase Hosting Verzeichnis vorbereiten
        run: |
          mkdir -p firebase-deploy
          cp -r release/wwwroot/* firebase-deploy/

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Google Cloud SDK einrichten
        uses: google-github-actions/setup-gcloud@v2

      - name: API zu Cloud Run deployen
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sc-manager-api
          region: europe-west1
          source: ./Api
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Auf Firebase Hosting deployen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'